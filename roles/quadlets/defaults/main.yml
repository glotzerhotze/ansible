---
# Podman quadlets on a shared macvlan network. Port of salt/quadlets.
#
# Per host, everything goes into one variable, `quadlets`
# (inventory/host_vars/<host>/quadlets.yml). It is deep-merged onto
# quadlets_defaults below (mappings merge, lists are replaced), the way the
# Salt formula merged pillar onto defaults.yaml. Schema: README.md.
#
# Keep a host's `quadlets` in one file: Ansible does not merge a dict from
# group_vars with the same dict from host_vars, the host's value replaces it.

quadlets_defaults:
  # Install podman
  manage_package: true
  pkg: podman

  # When false, only the unit files are written: no daemon-reload, no image
  # pulls, no secrets, no service start/stop, no network re-creation.
  manage_services: true

  # Rootful quadlet search path (macvlan with static IP/MAC needs rootful).
  # Every app gets its own subdirectory <config_dir>/<app>/; the shared
  # network unit stays in config_dir itself.
  config_dir: /etc/containers/systemd

  # Where the plain systemd units of apps (apps:<app>:units) go
  systemd_dir: /etc/systemd/system

  # Pull images during the run (before the service is (re)started), so a
  # slow pull never runs into the systemd start timeout and a bad image name
  # fails the run instead of a unit.
  pull_images: true

  # First line of every unit file this role writes. Files carrying it (or
  # one of quadlets_adopt_markers) are the role's own: they are removed when
  # they drop out of the config, hand-written ones are never touched.
  marker: "# Managed by Ansible (quadlets role) - local changes will be overwritten"

  # The one macvlan network all quadlets are attached to
  network:
    name: macvlan            # -> macvlan.network, podman network "macvlan"
    driver: macvlan
    parent: ~                # host interface, e.g. eth0 or bond0.20 (required)
    mode: ~                  # macvlan mode: bridge | private | vepa | passthru
    subnet: ~                # string or list (required)
    gateway: ~               # string or list
    ip_range: ~              # string or list; pool for quadlets without a static IP
    ipv6: false
    options: {}              # extra driver options -> Options=key=value
    # Quadlet only creates a network if it does not exist yet, so changes to
    # the .network file are ignored by podman. With this enabled the role
    # stops the attached quadlets, removes the podman network and lets it be
    # re-created whenever the .network file changes.
    recreate_on_change: true

  # Merged into every container (container settings win)
  container_defaults:
    Service:
      Restart: always
      TimeoutStartSec: 900
    Install:
      WantedBy: multi-user.target

  # Merged into the raw sections of every pod (app settings win)
  pod_defaults:
    Install:
      WantedBy: multi-user.target

  apps: {}

# Markers of earlier tools whose unit files this role adopts: the Salt
# formula's files are cleaned up like the role's own, and a file that differs
# only in this header line gets the new one without restarting anything or
# re-creating the network.
quadlets_adopt_markers:
  - "# Managed by Salt (quadlet formula) - local changes will be overwritten"
