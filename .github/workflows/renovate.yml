# Self-hosted Renovate: opens pull requests for newer image tags in
# pillar/quadlets/*.sls and for the actions below. Configuration: renovate.json.
#
# Needs the repository secret RENOVATE_TOKEN: a fine-grained personal access
# token (or GitHub App token) for this repository with read/write access to
# Contents, Pull requests, Issues (dependency dashboard) and Workflows (to
# update this file).
name: Renovate

on:
  schedule:
    # Mondays, 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # renovate.json is part of the repository, so no onboarding PR
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
